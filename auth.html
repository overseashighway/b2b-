<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OH B2B | Secure Partner Access</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#082744,#0d5770);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;color:#16344f}.shell{width:min(450px,92vw);background:white;border-radius:19px;padding:36px;box-shadow:0 25px 80px #0004}h1{margin:0;font-size:28px}h1 span{color:#079e9b}p{color:#6b8093;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin-top:17px}input{width:100%;padding:13px;margin-top:7px;border:1px solid #cbd9e3;border-radius:9px;font-size:15px}button{border:0;background:#078f98;color:white;border-radius:9px;padding:13px 18px;font-weight:750;cursor:pointer;width:100%;margin-top:20px}button:disabled{opacity:.5;cursor:not-allowed}.alt{background:#edf5f7;color:#173d56;margin-top:10px}.notice{background:#fff4df;border:1px solid #f4d6a0;padding:12px;border-radius:9px;font-size:13px;color:#71511e;margin:18px 0}.message{margin-top:14px;font-size:13px;white-space:pre-wrap}a{color:#068b93}</style></head><body><div class="shell"><h1>OH <span>B2B</span></h1><p>Global Partner Hub · Secure Access</p><div id="setup" class="notice" hidden>Authentication is not configured yet. Add the Supabase publishable key to <code>supabase-config.js</code> and apply the database schema before using this portal.</div><div id="login"><h2>Partner Login</h2><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8"></label><button id="signIn">Sign In</button><button class="alt" id="signUp">Request Partner Account</button><button class="alt" id="reset">Reset Password</button></div><div id="signed" hidden><h2>Account Details</h2><p id="identity"></p><p id="approval"></p><button id="logout">Sign Out</button></div><div id="msg" class="message" role="status" aria-live="polite"></div><p><a href="index.html">← Back to website</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
(function(){const cfg=window.OH_B2B_CONFIG||{},msg=document.getElementById('msg'),configured=!!(cfg.supabaseUrl&&cfg.supabasePublishableKey&&window.supabase);let sb=null;const say=(s,error=false)=>{msg.textContent=s;msg.style.color=error?'#a33434':'#087c70'};if(!configured){document.getElementById('setup').hidden=false;document.querySelectorAll('#login button').forEach(b=>b.disabled=true);return;}sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);async function refresh(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){document.getElementById('login').hidden=false;document.getElementById('signed').hidden=true;return;}document.getElementById('login').hidden=true;document.getElementById('signed').hidden=false;document.getElementById('identity').textContent='Signed in: '+user.email;const {data:profile,error:pe}=await sb.from('profiles').select('role,approved,display_name').eq('id',user.id).maybeSingle();document.getElementById('approval').textContent=pe?'Profile unavailable: database setup may be incomplete':profile?.approved?'Approved role: '+profile.role:'Account pending administrator approval. Access to partner data is not yet granted.';}
const fields=()=>({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});document.getElementById('signIn').onclick=async()=>{const {email,password}=fields();if(!email||!password)return say('Enter your email and password.',true);say('Signing in…');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return say(error.message,true);say('Signed in.');await refresh()};document.getElementById('signUp').onclick=async()=>{const {email,password}=fields();if(!email||password.length<8)return say('Enter an email and password of at least 8 characters.',true);say('Submitting account request…');const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});say(error?error.message:'Account request submitted. Check your email if confirmation is enabled. An administrator must approve access.',!!error)};document.getElementById('reset').onclick=async()=>{const email=fields().email;if(!email)return say('Enter your email first.',true);const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});say(error?error.message:'If an account exists, a password-reset email will be sent.',!!error)};document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();say('Signed out.');refresh()};sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh()})();
</script></body></html>
